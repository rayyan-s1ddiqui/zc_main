name: Deploy to AWS ECS

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1  # Update this if using a different region
  ECR_REPOSITORY: pharmacy-repo  # Keep the same name
  ECS_CLUSTER: pharmacy-cluster  # Keep the same name
  ECS_SERVICE: pharmacy-service  # Keep the same name
  CODEDEPLOY_APP: pharmacy-codedeploy-app  # Keep the same name
  CODEDEPLOY_GROUP: pharmacy-deployment-group  # Keep the same name
  IMAGE_TAG: latest

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Register new task definition and update ECS service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment

      - name: Trigger CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APP \
            --deployment-group-name $CODEDEPLOY_GROUP \
            --revision revisionType=AppSpecContent,appSpecContent={"version":"0.0","resources":[{"TargetService":{"Type":"AWS::ECS::Service","Properties":{"TaskDefinition":"$ECS_SERVICE","LoadBalancerInfo":{"ContainerName":"app","ContainerPort":80}}}}]}
